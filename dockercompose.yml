
services:
  fastapi:
    image: softvence/reviewiq-fastapi-app:latest
    container_name: fastapi_app
    restart: always

    ports:
      - "8000:8000"

    env_file:
      - .env
    environment:
      DB_PATH: /data/reviewiq.sqlite3
    volumes:
      - reviewiq_data:/data

volumes:
  reviewiq_data:
